---
name: PR - Auto Label
# Automatically applies labels to pull requests based on changed files.

"on":
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@614c5ad1fc91d742baed959643bdd1f261a71210  # v0.79.1
    with:
      job-name: "🏷️ Auto Label PR"
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '614c5ad1fc91d742baed959643bdd1f261a71210' # v0.79.1
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
