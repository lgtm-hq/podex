---
name: Security - Vulnerability Suppression Check
# Weekly check for stale or expired vulnerability suppressions in
# .osv-scanner.toml. Opens a cleanup PR when suppressions are no longer
# needed.

"on":
  schedule:
    # Weekly on Monday at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: vuln-suppression-check-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-suppressions:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-vuln-suppression-check.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    with:
      job-name: "🔍 Check Vulnerability Suppressions"
      workflow-file: vuln-suppression-check.yml
      egress-policy: block
      egress-preset: osv-scanner
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      # write: create cleanup branches and commits when suppressions expire
      contents: write
      # write: open cleanup pull requests
      pull-requests: write

  # One issue per workflow key; repeated failures update the open issue.
  notify-failure:
    needs: [check-suppressions]
    if: failure() && github.ref == 'refs/heads/main'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    permissions:
      actions: read
      contents: read
      issues: write
    with:
      egress-policy: block
      workflow-key: vuln-suppression-check
