---
name: PR - Auto Label
# Automatically applies labels to pull requests based on changed files.

"on":
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@8a6b1f553f1a0400a70db8910094073ce803cc4d  # v0.69.5
    with:
      job-name: "🏷️ Auto Label PR"
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '8a6b1f553f1a0400a70db8910094073ce803cc4d' # v0.69.5
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
