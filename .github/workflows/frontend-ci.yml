---
name: CI - Frontend

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node-custom.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      package-manager: bun
      working-directory: frontend
      # astro check then vitest with coverage (threshold in vitest.config.ts);
      # the && short-circuits so a check failure also fails the job.
      test-command: 'bun run check && bun run test:coverage'
      coverage: true
      job-name: '🎨 Frontend Checks'
      node-version: '22'
      draft-pr-skip: true
      tooling-ref: 'b830ca6972f0c9cbaeb1363283de594f68d66acf' # v0.87.0
      # The reusable's default allowlist already covers the node/bun install
      # registries (registry.npmjs.org, bun.sh); no caller override needed.
      egress-policy: block
    permissions:
      actions: write
      contents: read
      pull-requests: write

  # Main-only: one deduplicated `fix(ci): main workflow failed: frontend-ci` issue;
  # repeat failures comment on the open issue instead of filing new ones
  # (#447). While that issue is open, treat main as red.
  notify-failure:
    needs: [frontend]
    if: failure() && github.ref == 'refs/heads/main'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    permissions:
      actions: read
      contents: read
      issues: write
    with:
      egress-policy: block
      workflow-key: frontend-ci
      tooling-ref: 'b830ca6972f0c9cbaeb1363283de594f68d66acf' # v0.87.0
