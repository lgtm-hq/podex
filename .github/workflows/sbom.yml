---
name: Security - SBOM Generation
# Generate an SBOM for the podex monorepo on main, on release tags
# (attached to the GitHub Release), and on-demand.
# Syft directory scan at repo root covers both backend (uv.lock,
# pyproject.toml) and frontend (bun.lock, package.json) ecosystems.

"on":
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-${{ github.ref }}
  # Never cancel main/tag runs: a cancelled tag run leaves the release
  # without its SBOM asset.
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main'
    && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  sbom:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    with:
      job-name: '📋 SBOM & Supply Chain'
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      artifact-name: podex-sbom.cdx.json
      scan-vulnerabilities: true
      create-attestation: true
      egress-policy: block
      egress-preset: sbom
    permissions:
      # read: generation, scan, and attestation only read the repo; the
      # release-asset upload lives in sbom-release-upload below, the only
      # job in this path needing contents: write.
      contents: read
      # read: the SBOM job uploads Grype SARIF, which needs actions: read
      # since lgtm-ci v0.91.2 (lgtm-hq/lgtm-ci#1387)
      actions: read
      # write: upload Grype SARIF findings when upload-sarif is enabled
      security-events: write
      # write: OIDC token for SBOM attestation signing (create-attestation)
      id-token: write
      # write: publish SBOM build attestations
      attestations: write

  # Attach the SBOM produced above to the GitHub Release that
  # release-auto-tag created for this tag (#451). The artifact handoff has
  # a descriptive name, also used as the release asset's basename. The
  # pinned producer's local scan/attestation file remains sbom.json.
  sbom-release-upload:
    name: Upload SBOM release assets
    needs: sbom
    if: startsWith(github.ref, 'refs/tags/v')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom-release-upload.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    permissions:
      # write: attach assets to the existing release
      contents: write
    with:
      artifact-name: podex-sbom.cdx.json
      release-tag: ${{ github.ref_name }}
      egress-policy: block
      egress-preset: github-tooling

  # Main-only: one deduplicated `fix(ci): main workflow failed: sbom` issue;
  # repeat failures comment on the open issue instead of filing new ones
  # (#447). While that issue is open, treat main as red. Tag runs are not
  # gated here: the notifier only files for the default branch and would
  # skip with a green exit on a tag ref.
  # always() is required: sbom-release-upload is skipped on main, and a
  # dependent of a skipped job is itself skipped unless its `if` opts out.
  notify-failure:
    needs: [sbom, sbom-release-upload]
    if: always() && failure() && github.ref == 'refs/heads/main'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    permissions:
      actions: read
      contents: read
      issues: write
    with:
      egress-policy: block
      workflow-key: sbom
