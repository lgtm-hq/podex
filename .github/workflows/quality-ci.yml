---
name: Quality - Lint & Format

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Org ruleset (checks-podex): quality / 🛠️ Lintro Code Quality
  quality:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb  # v0.78.0
    permissions:
      contents: read
      packages: read
    with:
      job-name: '🛠️ Lintro Code Quality'
      tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
      working-directory: backend
      # Route semgrep to the repo-local #29 prompt-boundary rules (issue #236)
      # instead of the registry "auto" config, which egress-blocked CI cannot
      # reach anyway.
      lintro-tool-options: 'semgrep:config=.semgrep/prompt-boundary.yaml'
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:95b9fd9d62c3ca1227447467767ec915e78a7eef62282dd18c0b1c02ee4d3887
      egress-policy: block
      egress-preset: quality

  # actionlint over the whole repository. The quality job above lints only
  # backend/ (working-directory), so its actionlint step never saw
  # .github/workflows and logged "No GitHub workflow files found to check".
  # This job runs the same Lintro image at the repo root, limited to
  # actionlint, so every workflow is checked (.github/actionlint.yaml is
  # honoured).
  # Report uploads are off: the reusable's fixed artifact names would
  # overwrite the quality job's linting-report.
  actionlint:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb  # v0.78.0
    permissions:
      contents: read
      packages: read
    with:
      job-name: '🛠️ Lintro Actionlint'
      tools: actionlint
      working-directory: .
      upload-report: false
      upload-json-report: false
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:95b9fd9d62c3ca1227447467767ec915e78a7eef62282dd18c0b1c02ee4d3887
      egress-policy: block
      egress-preset: quality

  # Org ruleset (checks-podex): lintro-code-quality / 🛠️ Lintro Code Quality
  # Gates on both quality and actionlint, so a workflow that actionlint
  # rejects blocks the required context (and Renovate automerge).
  lintro-code-quality:
    needs: [quality, actionlint]
    if: >-
      always() &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.draft == false
      )
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-required-check.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb  # v0.78.0
    permissions:
      contents: read
    with:
      tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
      job-name: '🛠️ Lintro Code Quality'
      runner-image: ubuntu-24.04
      # quality's result/status unless it succeeded, then actionlint's
      # yamllint disable rule:line-length
      upstream-result: >-
        ${{ needs.quality.result == 'success' && needs.actionlint.result || needs.quality.result }}
      status-output: >-
        ${{ needs.quality.outputs.status == 'passed' && needs.actionlint.outputs.status || needs.quality.outputs.status }}
      # yamllint enable rule:line-length
      status-expected: passed
      egress-policy: block
      egress-preset: github-tooling

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        github.event.pull_request.draft == false
        || github.event.action == 'ready_for_review'
      )
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb  # v0.78.0
    permissions:
      contents: read
      pull-requests: write
    with:
      exit-code: ${{ needs.quality.outputs.exit-code }}
      tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
      egress-policy: block
      egress-preset: github-tooling

  # Main-only: one deduplicated `fix(ci): main workflow failed: quality-ci` issue;
  # repeat failures comment on the open issue instead of filing new ones
  # (#447). While that issue is open, treat main as red.
  notify-failure:
    needs: [quality, actionlint]
    if: failure() && github.ref == 'refs/heads/main'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb  # v0.78.0
    permissions:
      actions: read
      contents: read
      issues: write
    with:
      workflow-key: quality-ci
      tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
