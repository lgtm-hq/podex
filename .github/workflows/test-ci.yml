---
name: CI - Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Compat mode (lgtm-ci contract #340): multi-runtime matrix must not
  # collect coverage or publish PR summaries.
  # Org ruleset (checks-podex): test / Aggregate Python Results.
  # test-suite / 🧪 Test Suite below combines every test job (#550).
  test:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    with:
      python-versions: '3.11,3.12,3.13,3.14,3.15'
      working-directory: backend
      test-path: tests
      coverage: false
      publish-test-summary: false
      draft-pr-skip: true
      job-name: '🧪 Python Compatibility'
      # Distinct artifact prefixes (lgtm-ci v0.76 #1108): both calls run 3.13,
      # so the shared default `python-results-3.13` would let one call's
      # results overwrite the other's.
      artifact-prefix: compat
      egress-policy: block
      egress-preset: quality
      # Keep the quality preset and permit the artifact service (#561).
      allowed-endpoints-mode: append
      allowed-endpoints: results-receiver.actions.githubusercontent.com:443
    permissions:
      # multi-version matrix requires actions:write for artifact aggregation
      actions: write
      contents: read
      pull-requests: write

  # Postgres migration replay (#299 / epic #295): proves the Alembic chain
  # (0001+) replays cleanly on Postgres — not just SQLite — ahead of the Neon
  # cutover. Direct job rather than an lgtm-ci reusable workflow because
  # reusable-test-python has no service-container support.
  test-postgres-migrations:
    name: 🐘 Postgres Migration Replay
    runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.draft == false
    permissions:
      contents: read
    services:
      postgres:
        # pgvector-enabled image: migration 0010 creates a vector(1536)
        # column on Postgres, which requires the pgvector extension that the
        # stock postgres image does not ship.
        # yamllint disable-line rule:line-length
        image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
        env:
          POSTGRES_USER: podex
          # Trust auth: throwaway CI service on localhost only; avoids a
          # placeholder password that secret scanners flag.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: podex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U podex -d podex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Harden runner
        # The Postgres service container is pulled by the runner before any
        # step executes, so blocking docker.io here is safe. Allowlist covers
        # setup-uv's release download, uv's python-build-standalone fetch, and
        # dependency resolution from PyPI.
        # Pinned to SHA for supply chain security
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github-releases.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        # Pinned to SHA for supply chain security
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Exact uv release (not `latest`): the action SHA does not pin the
          # uv binary it downloads. Renovate's github-actions manager tracks
          # this input against astral-sh/uv releases.
          version: '0.13.8'
          enable-cache: false
      - name: Replay migrations on Postgres
        env:
          PODEX_DATABASE__URL: postgresql+psycopg://podex@localhost:5432/podex
        run: bash .github/scripts/postgres-migration-replay.sh

  # PostgreSQL application lane (#724): runs every test marked `postgres`
  # (service, API and concurrency tests) against the same pinned pgvector
  # image as the replay above, each in its own migrated database. The script
  # passes --require-postgres, so a missing database fails the job instead of
  # skipping. Reports `🐘 Postgres Application Tests` on every PR and push
  # (no path filter, so it never leaves the all-checks gate pending). No
  # coverage: the 85% floor stays on test-coverage alone. Direct job for the
  # same reason as the replay: reusable-test-python has no service support.
  test-postgres-application:
    name: 🐘 Postgres Application Tests
    runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.draft == false
    permissions:
      contents: read
    services:
      postgres:
        # Same digest as test-postgres-migrations; migration 0010 needs
        # pgvector.
        # yamllint disable-line rule:line-length
        image: pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
        env:
          # Superuser by default, so the fixture can CREATE DATABASE per test.
          POSTGRES_USER: podex
          # Trust auth: throwaway CI service on localhost only; avoids a
          # placeholder password that secret scanners flag.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: podex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U podex -d podex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Harden runner
        # Same allowlist as test-postgres-migrations: the service image is
        # pulled before any step runs, so docker.io stays blocked; the tests
        # reach the database on localhost only.
        # Pinned to SHA for supply chain security
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            github-releases.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - name: Checkout repository
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        # Pinned to SHA for supply chain security
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Exact uv release, kept equal to test-postgres-migrations.
          version: '0.13.8'
          enable-cache: false
      - name: Run PostgreSQL application tests
        env:
          PODEX_DATABASE__URL: postgresql+psycopg://podex@localhost:5432/podex
        run: bash .github/scripts/postgres-application-tests.sh

  # Coverage publishing (#200 / epic #114): no separate coverage.yml calling
  # reusable-coverage.yml. test-coverage already collects coverage, enforces the
  # 85% threshold, uploads artifacts, and publishes the PR summary via
  # reusable-test-python. reusable-coverage would only add multi-artifact merge,
  # badge generation, and optional GitHub Pages — not needed for this repo.
  #
  # Coverage mode (lgtm-ci contract #340): single runtime with coverage
  # reporting and the PR test summary comment.
  test-coverage:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    with:
      python-version: '3.13'
      working-directory: backend
      test-path: tests
      coverage: true
      coverage-format: json
      coverage-threshold: 85
      upload-coverage: true
      publish-test-summary: true
      draft-pr-skip: true
      job-name: '🧪 Python Coverage'
      artifact-prefix: coverage
      egress-policy: block
      egress-preset: quality
      # Keep the quality preset and permit the artifact service (#561).
      allowed-endpoints-mode: append
      allowed-endpoints: results-receiver.actions.githubusercontent.com:443
    permissions:
      actions: write
      contents: read
      pull-requests: write

  # BATS tests for CI shell scripts under .github/scripts (#550).
  test-shell:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-shell.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    with:
      job-name: '🐚 Shell Tests'
      test-path: tests/bats
      coverage: false
      publish-test-summary: false
      draft-pr-skip: true
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      # lgtm-ci v0.76: the aggregate job lists run artifacts, and GitHub
      # validates that permission statically; without it the run fails at
      # startup.
      actions: read
      contents: read
      # The reusable's summary job declares pull-requests: write statically;
      # a caller that grants less fails at startup even with the summary off.
      pull-requests: write

  # Combined test gate (#550): one verdict over every test job, so a failure
  # in the Python matrix, coverage, Postgres replay, Postgres application
  # tests or shell tests fails the required context. Reads needs.*.result
  # directly. Skipped jobs (draft PRs) pass.
  test-gate:
    name: 🚦 Test Gate
    needs:
      - test
      - test-coverage
      - test-postgres-migrations
      - test-postgres-application
      - test-shell
    if: always() && !cancelled()
    runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    # No token scopes needed: podex is public, so the sparse checkout below
    # reads the gate script anonymously. Grant contents: read if that changes.
    permissions: {}
    outputs:
      result: ${{ steps.gate.outputs.result }}
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - name: Checkout gate script
        # Pinned to SHA for supply chain security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github/scripts/evaluate-test-gate.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Evaluate upstream results
        id: gate
        env:
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.test-coverage.result }}
          MIGRATIONS_RESULT: ${{ needs.test-postgres-migrations.result }}
          POSTGRES_RESULT: ${{ needs.test-postgres-application.result }}
          SHELL_RESULT: ${{ needs.test-shell.result }}
        run: bash .github/scripts/evaluate-test-gate.sh

  # Org ruleset (checks-podex): test-suite / 🧪 Test Suite
  # Mirrors test-gate. upstream-result is the gate job's own result, so a gate
  # that crashes or never writes its outputs also fails this context.
  test-suite:
    needs: [test-gate]
    if: always() && !cancelled()
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-required-check.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    permissions:
      contents: read
    with:
      job-name: '🧪 Test Suite'
      upstream-result: ${{ needs.test-gate.result }}
      passed-output: ${{ needs.test-gate.outputs.passed }}
      egress-policy: block
      egress-preset: github-tooling

  # Main-only: one deduplicated `fix(ci): main workflow failed: test-ci` issue;
  # repeat failures comment on the open issue instead of filing new ones
  # (#447). While that issue is open, treat main as red.
  notify-failure:
    needs:
      - test
      - test-postgres-migrations
      - test-postgres-application
      - test-coverage
      - test-shell
      - test-gate
      - test-suite
    if: failure() && github.ref == 'refs/heads/main'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    permissions:
      actions: read
      contents: read
      issues: write
    with:
      egress-policy: block
      workflow-key: test-ci
