---
name: Security - OpenSSF Scorecard Analysis
# Weekly OpenSSF Scorecard security analysis.

"on":
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecards:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-scorecards.yml@8a48e818c43efe4ac3b2669b2be31bee0b99cb15 # v0.98.7
    with:
      job-name: "🛡️ Scorecard Analysis"
      egress-policy: block
      allowed-endpoints: >
        github.com:443 api.github.com:443 codeload.github.com:443
        objects.githubusercontent.com:443 raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443 gcr.io:443 api.osv.dev:443
        api.scorecard.dev:443 api.securityscorecards.dev:443
        agent.api.stepsecurity.io:443 api.deps.dev:443 api.osv.dev:443
        api.scorecard.dev:443 fulcio.sigstore.dev:443 rekor.sigstore.dev:443
        sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443
        release-assets.githubusercontent.com:443
        oss-fuzz-build-logs.storage.googleapis.com:443 ossf.github.io:443
        www.bestpractices.dev:443
    permissions:
      contents: read
      # read: the analysis job uploads SARIF, which needs actions: read
      # since lgtm-ci v0.91.2 (lgtm-hq/lgtm-ci#1387)
      actions: read
      security-events: write
      id-token: write

  # One issue per workflow key; repeated failures update the open issue.
  notify-failure:
    needs: [scorecards]
    if: failure() && github.ref == 'refs/heads/main'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@8a48e818c43efe4ac3b2669b2be31bee0b99cb15 # v0.98.7
    permissions:
      actions: read
      contents: read
      issues: write
    with:
      egress-policy: block
      workflow-key: scorecards
