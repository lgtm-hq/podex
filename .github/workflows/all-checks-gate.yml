---
name: PR - All Checks Gate
# One required check, `gate / ✅ All Checks Passed`, that passes only when
# every other check on the PR head (or merge-queue head) finished success,
# skipped or neutral, so native auto-merge and the merge queue wait for all
# checks, not just the required ones. Keep it in its own workflow file: runs
# of this file are excluded so the gate never waits on itself.

'on':
  push:
    branches: [main]
  pull_request:
    # `edited` too: PR - Title Validation re-runs on title edits.
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:

permissions: {}

concurrency:
  group: all-checks-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-all-checks-gate.yml@8a48e818c43efe4ac3b2669b2be31bee0b99cb15 # v0.98.7
    with:
      # Draft-skipped producers must not leave a green gate at readiness.
      fail-on-draft: true
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
