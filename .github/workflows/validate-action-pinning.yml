---
name: Quality Check - Action Pinning Validation

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@23c79b65490a3307fb08cdefafa22db12f75b9b2  # v0.63.1
    with:
      tooling-ref: '23c79b65490a3307fb08cdefafa22db12f75b9b2' # v0.63.1
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
