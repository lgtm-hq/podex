---
name: Quality Check - Action Pinning Validation

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@42aad382e0ca51e425a24f54053c298e588a9862 # v0.82.2
    with:
      job-name: '📌 Validate Action Pinning'
      tooling-ref: '42aad382e0ca51e425a24f54053c298e588a9862' # v0.82.2
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
