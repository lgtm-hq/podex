---
name: Quality Check - Action Pinning Validation

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@22bb159287eb23a812d533090615525eccb839ac  # v0.75.1
    with:
      job-name: '📌 Validate Action Pinning'
      tooling-ref: '22bb159287eb23a812d533090615525eccb839ac' # v0.75.1
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
