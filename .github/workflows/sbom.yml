---
name: Security - SBOM Generation
# Generate an SBOM for the podex monorepo on main, on release tags
# (attached to the GitHub Release), and on-demand.
# Syft directory scan at repo root covers both backend (uv.lock,
# pyproject.toml) and frontend (bun.lock, package.json) ecosystems.

"on":
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-${{ github.ref }}
  # Never cancel main/tag runs: a cancelled tag run leaves the release
  # without its SBOM asset.
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main'
    && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  sbom:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc  # v0.69.2
    with:
      job-name: '📋 SBOM & Supply Chain'
      target: .
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      create-attestation: true
      tooling-ref: 'c14fbb654af2fc59c4abd7435e85a269a57057fc' # v0.69.2
      egress-policy: block
      egress-preset: sbom
    permissions:
      # read: generation, scan, and attestation only read the repo; the
      # release-asset upload lives in reusable-sbom-release-upload.yml
      # (lgtm-ci#770), the only job in this path needing contents: write.
      contents: read
      # write: upload Grype SARIF findings when upload-sarif is enabled
      security-events: write
      # write: OIDC token for SBOM attestation signing (create-attestation)
      id-token: write
      # write: publish SBOM build attestations
      attestations: write

  # Attach the SBOM produced above to the GitHub Release that
  # release-auto-tag created for this tag (#451).
  sbom-release-upload:
    needs: sbom
    if: startsWith(github.ref, 'refs/tags/v')
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom-release-upload.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc  # v0.69.2
    with:
      artifact-name: sbom
      tooling-ref: 'c14fbb654af2fc59c4abd7435e85a269a57057fc' # v0.69.2
      egress-policy: block
    permissions:
      # write: `gh release upload` onto the existing release
      contents: write

  # Main-only: one deduplicated `fix(ci): main workflow failed: sbom` issue;
  # repeat failures comment on the open issue instead of filing new ones
  # (#447). While that issue is open, treat main as red.
  notify-failure:
    needs: [sbom, sbom-release-upload]
    if: >-
      failure()
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v'))
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc  # v0.69.2
    permissions:
      actions: read
      contents: read
      issues: write
    with:
      workflow-key: sbom
      tooling-ref: 'c14fbb654af2fc59c4abd7435e85a269a57057fc' # v0.69.2
