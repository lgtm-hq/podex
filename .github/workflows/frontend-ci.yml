---
name: CI - Frontend

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  # A push to main gets one group per commit (#44): a later push cannot
  # replace the pending run of an earlier one, so every main commit keeps a
  # completed run. Every other run keeps the group without the suffix.
  group: >-
    frontend-ci-${{ github.ref }}${{ github.event_name == 'push' && github.ref
    == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node-custom.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    with:
      package-manager: bun
      working-directory: frontend
      # astro check then vitest with coverage (threshold in vitest.config.ts);
      # the && short-circuits so a check failure also fails the job.
      test-command: "bun run check && bun run test:coverage"
      coverage: true
      job-name: "🎨 Frontend Checks"
      node-version: "22"
      draft-pr-skip: true
      # The reusable's default allowlist already covers the node/bun install
      # registries (registry.npmjs.org, bun.sh); no caller override needed.
      egress-policy: block
    permissions:
      actions: write
      contents: read
      pull-requests: write

  # Main-only: one deduplicated `fix(ci): main workflow failed: frontend-ci` issue;
  # repeat failures comment on the open issue instead of filing new ones
  # (#447). While that issue is open, treat main as red.
  notify-failure:
    needs: [frontend]
    if: failure() && github.ref == 'refs/heads/main'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@0c373f1252e0fe23a1e119df639b51d63b02b7d8 # v0.116.3
    permissions:
      actions: read
      contents: read
      issues: write
    with:
      egress-policy: block
      workflow-key: frontend-ci
