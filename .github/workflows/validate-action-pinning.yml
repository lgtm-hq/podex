---
name: Quality Check - Action Pinning Validation

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@a167ee7165319d00dc92604ecdef87b719a0a55d  # v0.74.4
    with:
      job-name: '📌 Validate Action Pinning'
      tooling-ref: 'a167ee7165319d00dc92604ecdef87b719a0a55d' # v0.74.4
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
