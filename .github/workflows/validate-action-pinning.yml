---
name: Quality Check - Action Pinning Validation

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    with:
      job-name: '📌 Validate Action Pinning'
      tooling-ref: '808da537a4e346ac1ab3b9e1df10142909b96bc6' # v0.98.3
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
