[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
ignoreUntil = 2026-11-02
reason = """http-cache-semantics@4.2.0 (transitive via astro@7.3.5, frontend/bun.lock). No fix available: GHSA-ch52-4w7c-c8xp / CVE-2026-93748 lists first_patched_version = none; npm latest is 4.2.0 (only 4.2.0-beta.x prereleases beyond it). Usage: build-time only — astro imports it solely in dist/assets/build/remote.js for caching remote images through astro:assets; podex runs output:"server" with the node adapter and does not use astro:assets or remote images (no `astro:assets` imports in src/, no image remotePatterns/domains configured), so the vulnerable code path is never reachable in the built server or at runtime. Exploitability: none in this deployment; there is no shared cache processing client max-stale directives. Tracking: https://github.com/kornelski/http-cache-semantics (issue #57) and GHSA-ch52-4w7c-c8xp."""
