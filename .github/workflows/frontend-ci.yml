---
name: CI - Frontend

"on":
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node-custom.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc  # v0.69.2
    with:
      package-manager: bun
      working-directory: frontend
      # astro check then vitest with coverage (threshold in vitest.config.ts);
      # the && short-circuits so a check failure also fails the job.
      test-command: 'bun run check && bun run test:coverage'
      coverage: true
      job-name: '🎨 Frontend Checks'
      node-version: '22'
      draft-pr-skip: true
      tooling-ref: 'c14fbb654af2fc59c4abd7435e85a269a57057fc' # v0.69.2
      # The reusable's default allowlist already covers the node/bun install
      # registries (registry.npmjs.org, bun.sh); no caller override needed.
      egress-policy: block
    permissions:
      actions: write
      contents: read
      pull-requests: write

  # Main-only: one deduplicated `fix(ci): main workflow failed: frontend-ci` issue;
  # repeat failures comment on the open issue instead of filing new ones
  # (#447). While that issue is open, treat main as red.
  notify-failure:
    needs: [frontend]
    if: failure() && github.ref == 'refs/heads/main'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc  # v0.69.2
    permissions:
      actions: read
      contents: read
      issues: write
    with:
      workflow-key: frontend-ci
      tooling-ref: 'c14fbb654af2fc59c4abd7435e85a269a57057fc' # v0.69.2
