---
name: Auto Rerun on Infra Failure

# When a listed workflow fails and its failed-job logs match a known
# GitHub-side outage signature ("Failed to resolve action download info",
# runner shutdown signals, harden-runner allowed-domain resolution errors,
# cosign ambient-OIDC hiccups), re-run only the failed jobs — once (#448).
#
# workflow_run triggers only run from the definition on the default branch,
# so changes here take effect after merging to main. Do not use
# workflow_run.branches: tag-push runs expose the tag as head_branch and
# would be filtered before this job can inspect/rerun matching failures.

"on":
  workflow_run:
    workflows:
      - CI - Tests
      - CI - Frontend
      - CI - Docker Build & Publish
      - Quality - Lint & Format
      - Security - OSV Audit
      - Security - SBOM Generation
      - Security - CodeQL Code Scanning
      - Release - Version PR
      - Release - Auto Tag
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request' &&
      (github.event.workflow_run.head_branch == 'main' ||
      startsWith(github.event.workflow_run.head_branch, 'v'))
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-auto-rerun-on-infra-failure.yml@f57b4d014f82d7f5996c7b339f1b2ca681780921  # v0.69.4
    permissions:
      actions: write # rerun failed jobs and read failed-job logs
      contents: read # repository context for the tooling checkout
    with:
      tooling-ref: 'f57b4d014f82d7f5996c7b339f1b2ca681780921' # v0.69.4
      # run id/attempt are numbers in the event payload; format() passes them
      # as the strings the reusable workflow inputs expect.
      run-id: ${{ format('{0}', github.event.workflow_run.id) }}
      run-attempt: ${{ format('{0}', github.event.workflow_run.run_attempt) }}
      egress-policy: block
      egress-preset: github-minimal
      # Trivy DB mirror 404s during the reusable-docker scan are infra, not
      # CVEs (same signatures Rustume carries).
      signatures: |
        failed to download vulnerability DB
        mirror.gcr.io/aquasec/trivy-db
        failed to fetch the layer: GET https://mirror.gcr.io/artifacts-downloads
