---
name: Security - OSV Audit

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  schedule:
    # Weekly on Monday at 05:30 UTC
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Org ruleset (checks-podex): security-audit / 🔐 Security Audit
  security-audit:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-security-audit.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    with:
      job-name: '🔐 Security Audit'
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro:0.180.30@sha256:6d6a3dc5cd2d83c4b997a1d21607fcb3499677994cad66aba858e0de5439df02
      upload-comment-artifact: ${{ github.event_name == 'pull_request' }}
      egress-policy: block
      egress-preset: quality
    permissions:
      # read: checkout lockfiles and manifests for OSV scanning
      contents: read
      # read: pull the py-lintro image from ghcr.io
      packages: read

  publish-security-audit-comment:
    needs: security-audit
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        github.event.pull_request.draft == false
        || github.event.action == 'ready_for_review'
      )
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-security-audit-comment.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    with:
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      # read: checkout repository for comment generation
      contents: read
      # write: post OSV audit summary on the PR
      pull-requests: write

  # Main-only: one deduplicated `fix(ci): main workflow failed: security-audit` issue;
  # repeat failures comment on the open issue instead of filing new ones
  # (#447). While that issue is open, treat main as red.
  notify-failure:
    needs: [security-audit]
    if: failure() && github.ref == 'refs/heads/main'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@808da537a4e346ac1ab3b9e1df10142909b96bc6 # v0.98.3
    permissions:
      actions: read
      contents: read
      issues: write
    with:
      egress-policy: block
      workflow-key: security-audit
