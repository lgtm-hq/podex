---
name: Quality Check - Action Pinning Validation

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@f885a358042158e73f49763cfd37af597ca52883  # v0.64.0
    with:
      tooling-ref: 'f885a358042158e73f49763cfd37af597ca52883' # v0.64.0
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
