---
name: Security - CodeQL Code Scanning

"on":
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      - '.github/**'
  merge_group:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-codeql.yml@f57b4d014f82d7f5996c7b339f1b2ca681780921  # v0.69.4
    with:
      job-name: '🔬 CodeQL Analysis'
      languages: python
      build-mode: none
      config-file: .github/codeql/codeql-config.yml
      category: '/language:all'
      tooling-ref: 'f57b4d014f82d7f5996c7b339f1b2ca681780921' # v0.69.4
      egress-policy: block
      egress-preset: github-tooling
      # CodeQL bundle downloads redirect to
      # release-assets.githubusercontent.com, which the github-tooling preset
      # lacks. The reusable's setup job hardens with this raw input before
      # the allowlist resolver runs, and since lgtm-ci v0.50.0 a caller
      # allowed-endpoints REPLACES the baseline, so the complete endpoint
      # list must be passed (reusable input default plus the release-assets
      # host) rather than a single appended host (lgtm-hq/lgtm-ci#517).
      allowed-endpoints: >-
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        release-assets.githubusercontent.com:443
    permissions:
      contents: read
      security-events: write

  # Main-only: one deduplicated `fix(ci): main workflow failed: codeql` issue;
  # repeat failures comment on the open issue instead of filing new ones
  # (#447). While that issue is open, treat main as red.
  notify-failure:
    needs: [codeql]
    if: failure() && github.ref == 'refs/heads/main'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-main-failure-notifier.yml@f57b4d014f82d7f5996c7b339f1b2ca681780921  # v0.69.4
    permissions:
      actions: read
      contents: read
      issues: write
    with:
      workflow-key: codeql
      tooling-ref: 'f57b4d014f82d7f5996c7b339f1b2ca681780921' # v0.69.4
